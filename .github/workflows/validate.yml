name: validate

on:
  push:
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --upgrade pip pyyaml pandas
      - name: Validate bot-team structure
        run: python bot-team/tests/validate_structure.py
      - name: Validate demo report
        run: python bot-team/tests/validate_report.py bot-team/runs/demo-report.json
      - name: Real-mode smoke (synthetic data)
        run: python bot-team/tests/real_mode_smoke.py
      - name: Negative gates (must reject demo/narrative/missing data)
        run: python bot-team/tests/negative_gates.py
