# L0 感知与数据质量前置规则（来源：AI智能经营模型 v1.3 §1/§3）
# 用途：咨询分析师/取数员在归因前做异常检测与降级判定；不改 demo 数据。
version: "1.0"
detection:
  method: sigma
  sigma: 2
  baseline_window_days: 30
  min_points: 14
  anomaly_direction: both
  note: 当前值超出 μ±2σ 视为异常；数据不足 14 点不下结论
data_quality:
  grades:
    A: {max_deviation: 0.05, max_latency_hours: 24, source: system}
    B: {max_deviation: 0.10, max_latency_hours: 48, source: system_excel}
    C: {max_deviation: null, max_latency_hours: null, source: excel}
  factor_quality_map:
    refill_rate: A
    output_volume: A
    mold_status: B
    maintenance_records: B
    material_batch: A
    shift_team: B
    ambient_env: C
    mold_change_records: B
    downtime_records: B
    reporter: B
degradation:
  - {max_null_rate: 0.10, level: normal, method: exclusion_six_steps}
  - {min_null_rate: 0.10, max_null_rate: 0.30, level: counterfactual, method: counterfactual}
  - {min_null_rate: 0.30, level: manual, method: manual_review}
hard_stops:
  - 核心三项（补料率/模具状态/保养记录）任一 missing → 暂停归因
  - 数据合同缺失 > 2 项 → 只出快照不出归因
  - 连续 3 次建议方向错误 → 暂停该场景 AI 建议（降级为仅感知）
failure_modes:
  - {id: direction_wrong, signal: 执行后指标恶化超 1σ, action: 标记错误归因并保留记录}
  - {id: system_failure, signal: 30 天内 3 次方向错误, action: 暂停 AI 建议，人工归因}
  - {id: data_break, signal: 数据完整性 <30 分连续 2 期, action: 暂停 AI 建议，IT 排查}
  - {id: overfit, signal: 校准后验证集准确率低于训练集 15%, action: 回滚上一版权重}
