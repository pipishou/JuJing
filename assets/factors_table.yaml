# 11 类因素枚举表（制造业经营归因封闭世界）
# 来源：模型 v1.3 Section 3 · PRD §7
# 用途：AI 归因专家封闭世界边界 + 咨询分析师快照对比 + 业务专家先验权重标注
# 纪律：表外因素一律不进入 finding，只可进 cannot_attribute（残差）

version: "1.3"
domain: 小型制造业经营异常归因
axes:
  - id: date
    name: 日期
    note: 时间轴索引维度，不参与归因枚举计数，仅作 T vs T-30 对齐
factors:  # 11 类因素（日期为轴不计入）
  - id: production_line
    name: 产线
    data_source: 生产日台账
    availability: available
    prior_weight: 0.00
    note: 分组维度，用于定位异常范围
  - id: refill_rate
    name: 补料率
    data_source: MES 补料记录 / 日产量与补料量
    availability: available
    prior_weight: 0.00
    note: 目标指标本身，非候选因素
  - id: output_volume
    name: 产量
    data_source: 生产日台账
    availability: available
    prior_weight: 0.10
    note: 产量爬坡/换型可放大补料波动
  - id: mold_status
    name: 模具状态
    data_source: 设备台账 + 模具寿命计数
    availability: available
    prior_weight: 0.25
    note: 补料率问题的高权重因素（磨损/老化直接推高单次失败率）
  - id: maintenance_records
    name: 保养记录
    data_source: 设保系统保养工单
    availability: available
    prior_weight: 0.25
    note: 补料率问题的高权重因素（保养超期与模具磨损强相关）
  - id: shift_team
    name: 班组
    data_source: 排班表
    availability: available
    prior_weight: 0.10
    note: 班组操作差异；注意换班时点与异常起点是否吻合
  - id: material_batch
    name: 原料批次
    data_source: IQC 来料检验 + 批次追溯
    availability: available
    prior_weight: 0.10
    note: 批次切换时点需与异常起点对齐检验
  - id: ambient_env
    name: 环境温湿度
    data_source: 车间环境监测
    availability: partial
    prior_weight: 0.05
    note: 季节性影响，通常为弱因素
  - id: mold_change_records
    name: 换模记录
    data_source: MES 换模事件
    availability: available
    prior_weight: 0.10
    note: 新模磨合期可能反向影响补料率
  - id: downtime_records
    name: 停机记录
    data_source: MES 停机事件
    availability: available
    prior_weight: 0.05
    note: 与补料率多为伴生现象，注意因果方向
  - id: reporter
    name: 信息员
    data_source: 数据上报人员名册
    availability: partial
    prior_weight: 0.00
    note: 上报口径因素——换人可引入系统性偏差，通常无法用数据排除，进 cannot_attribute
null_rate_threshold: 0.10
notes: >-
  prior_weight 合计按 1.00 归一（date/production_line/refill_rate/reporter 为维度或口径因素，
  权重计入其余因素后归一）。availability 为冷启动默认值，业务专家在 s2 依数据实况重标。
