# 三级降级规则
# 来源：模型 v1.3 · PRD §4.6 / §7 / G0-4
# 执行者：host（装载方）+ 各角色按触发条件执行

version: "1.3"
rules:
  - level: 1
    id: counterfactual
    trigger: 候选归因 ≥ 2 个
    action: 补做反事实检验（排除法第 5 步），区分主因与共因
    demo_variant: 主流程（material_refill_T.json）
  - level: 2
    id: human_handoff
    trigger: 空值率 > 10%
    action: 转人工——数据质量不足，建议安排数据核查后重跑；不得硬给归因结论
    demo_variant: 变体 B（material_refill_T_variantB_nulls.json，空值率≈15%）
  - level: 3
    id: pause
    trigger: 连续 3 次归因失败，或关键字段（如 refill_rate/mold_status）整体缺失
    action: 暂停并说明——明确告知缺什么、为什么算不了、需要补什么
    demo_variant: 变体 C（material_refill_T_variantC_missing.json，关键字段缺失）
escalation_note: >-
  降级不是失败：每级降级本身都要写决策日志条目（context=降级触发原因，
  advice=转人工/暂停说明）。三级规则在 host 的 s5 收敛时统一校验。
