# 排除法六步流程定义
# 来源：模型 v1.3 §3 · PRD §4.2 s3
# 执行者：AI 归因专家（manufacturing-ops/ai-attribution-expert）

version: "1.3"
method: exclusion_six_steps
steps:
  - order: 1
    id: snapshot
    name: 快照
    action: 接收 {{snapshot}} 对比表，确认 11 因素齐全、空值率已标注、Δ 已算出
    fail_to: 上游表不齐 → 退回 s1 补数，不硬算
  - order: 2
    id: change
    name: 变化
    action: 筛出 Δ 超 2σ 的显著变化因素，按 {{factor_table}} 先验权重排序
    output: 显著变化因素短名单
  - order: 3
    id: exclusion
    name: 排除
    action: 逐因素检验——变化与异常同向吗？时间上先于（或同步于）异常起点吗？不满足者排除并留一行理由
    output: 排除轨迹（每因素一行理由，禁止「基于经验排除」）
  - order: 4
    id: direction
    name: 方向
    action: 对存活候选校验作用方向与量级（机理讲得通吗？幅度解释得动异常吗？）
    output: 方向校验结论，交业务专家复核（s4 方向一致性校验）
  - order: 5
    id: counterfactual
    name: 反事实
    action: 候选≥2 个时必做——「若无该因素变化，异常还能解释多少？」；触发条件见 degradation_rules.yaml
    output: 反事实检验结果
  - order: 6
    id: residual
    name: 残差
    action: 排不掉、算不清、表外、口径存疑的全部进 cannot_attribute，强制非空
    output: cannot_attribute 列表
exit_rule: >-
  六步走完若 finding 为空：输出「本轮无法归因」+ cannot_attribute（仍非空）+
  补数建议，触发降级规则，不以「最可能」名义硬给候选
