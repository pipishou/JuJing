# CRP（Closed-World Reasoning Prompt）：封闭世界指令 + 产出 schema 槽位
# 来源：模型 v1.3 CRP · PRD §4.5
# 用途：AI 归因专家产出契约 + host 报告收敛模板

version: "1.3"
closed_world_rules:
  - 只在 assets/factors_table.yaml 枚举的 11 类因素内寻找候选原因；表外因素只可进 cannot_attribute
  - 枚举表外的用户问题（风水、闲聊、其他行业）→ 明确拒答或转人工，格式：「该问题不在归因范围内（封闭世界：11 类因素枚举表），建议转人工处理」
  - 所有数值结论必须引用数据出处（文件+字段），无出处不结论
output_schema:
  finding:
    max_items: 2
    item_fields:
      factor: 因素名（必须来自 factors_table.yaml 枚举）
      confidence: 六维加权分（权重表 scorecard_six_dim.yaml，保留两位）
      evidence: '引用列表，每条带上游步骤与数据出处，如 "s1: 3号模具保养记录 T-30 无记录"'
  cannot_attribute:
    required: true          # 强制非空——残差与不确定性必须说出
    min_items: 1
    example: "信息员 T-15 换人，上报偏差 5%~10%（B级数据），无法排除漏报因素"
  scorecard:
    dims: [data_completeness, timeliness, significance, exclusivity, history, human_ai_consistency]
    item_fields: {score: "0-5 整数", evidence: "一句话依据"}
  recommendation:
    item_fields:
      action: 行动（谁/在哪台设备/何时/做什么）
      roi:
        cost: 花费（锚点见 roi_anchors.yaml）
        avoided: 避免损失（含预估次数）
        anchor: 一句话算账结论
      irreversibility: reversible | irreversible（irreversible 必须触发 securityGate）
  decision_log_entry:
    schema_ref: assets/decision_log.schema.yaml
    write_to: decision_log/
anti_drift_rules:
  - 旗舰输入种子固定：「B 产线补料率连续 7 天从 5.1% 爬到 7.2%，帮我归因。」（PRD §11 防漂移）
  - 产出槽位缺一不可：finding + cannot_attribute + scorecard + recommendation + decision_log_entry
  - 禁止输出 schema 之外的自创字段（下游校验器按此 schema 解析）
