# 补料率场景 · 决策契约（来源：AI智能经营模型 v1.3 §3）
# 用途：班组启动前确认"决策单元/频率/可选行动/主结果/成本/护栏/学习方式/负责人"
version: "1.0"
scenario: refill_rate
decision_unit: [产线, 模具, 班组]
frequency: monthly
actions:
  - {id: no_action, label: 不行动, cost: 0}
  - {id: replace_mold, label: 更换模具, cost_cny: 800}
  - {id: adjust_formula, label: 调整原料配比, cost: 0}
  - {id: maintenance, label: 安排保养, cost_cny: 500}
  - {id: train_operator, label: 培训技术员, cost: 0}
primary_outcome: 30 天内补料率变化 + 对应成本节约
costs:
  mold_replace_cny: 800
  maintenance_cny: 500
  downtime_cny: 1200
guardrails:
  - 单月更换频次 ≤ 3 次
  - 不影响交付计划
  - 不可逆动作只呈请 securityGate，不执行
learning:
  primary: exclusion_six_steps
  fallback: counterfactual
  note: 候选因素≥2 且无法区分主次 → 标记反事实推断
owner: 生产部负责人（不是数据团队）
data_quality:
  grades: [A, B, C]
  null_rate:
    normal: "<=0.10"
    counterfactual: "0.10-0.30"
    manual: ">0.30"
