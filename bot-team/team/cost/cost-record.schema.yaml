# 成本记录 schema（v1.0）
version: "1.0"
required: [cost_id, task_id, date, ai_cost_cny, human_hours_saved, action_cost_cny, avoided_loss_cny, source]
fields:
  cost_id: {type: string, format: "C-YYYYMMDD-序号"}
  task_id: {type: string}
  date: {type: string, format: date}
  ai_cost_cny: {type: number, min: 0}
  ai_tokens: {type: integer, min: 0}
  human_hours_saved: {type: number, min: 0}
  human_hourly_cny: {type: number, default: 50}
  human_cost_saved_cny: {type: number, note: human_hours_saved × hourly}
  action_cost_cny: {type: number, min: 0}
  avoided_loss_cny: {type: number, min: 0}
  net_benefit_cny: {type: number}
  roi: {type: number, note: net_benefit / (action+ai)}
  source: {type: string, enum: [billing, estimate]}
  verified: {type: boolean}
  notes: {type: string}
