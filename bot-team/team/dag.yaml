# 五步 DAG（旗舰：补料率异常归因）
# 上游协议：manufacturing-ops-team/AGENTS.md §3（Octop 版）；本文件为 DSH 版唯一事实源。
# 规则：depends_on 为空或省略 = 可立即并行；{{var}} = 引用上游 output。

goal: "B产线补料率7日爬升(5.1%→7.2%)的根因归因与行动建议"
parallel_groups:
  - [s1_data_snapshot, s2_factor_table]
steps:
  - id: s1_data_snapshot
    role: consulting-analyst
    layer: L0
    task: "读取 demo/material_refill_T.json 与 demo/material_refill_T30.json，对 11 类因素做 T vs T-30 快照对比；标注每因素可得性(available/partial/missing)与空值率；输出 {{snapshot}}"
    depends_on: []
    output: snapshot
  - id: s2_factor_table
    role: manufacturing-ops-expert
    layer: L2-prep
    task: "装载 assets/factors_table.yaml，为每个候选因素标注数据可得性与先验权重（写理由），输出 {{factor_table}}"
    depends_on: []
    output: factor_table
  - id: s3_exclusion
    role: ai-attribution-expert
    layer: L1
    task: "基于 {{snapshot}} 与 {{factor_table}}，执行排除法六步（快照→变化→排除→方向→反事实→残差），输出候选归因(≤2)与强制非空的 cannot_attribute"
    depends_on: [s1_data_snapshot, s2_factor_table]
    output: attribution
  - id: s4_recommendation
    role: manufacturing-ops-expert
    layer: L2
    task: "对 {{attribution}} 做方向一致性校验，用 ROI 三锚点（模具更换¥800/保养¥500/停机¥1200）算账，输出 {{advice}}；含不可逆动作先呈请 securityGate"
    depends_on: [s3_exclusion]
    output: advice
  - id: s5_report
    role: host
    layer: L3
    task: "汇总 {{snapshot}}/{{attribution}}/{{advice}} 成归因报告：finding(≤2)+cannot_attribute(非空)+六维 scorecard+recommendation(ROI)+decision_log_entry；追加写入 decision_log/"
    depends_on: [s4_recommendation]
    output: report
