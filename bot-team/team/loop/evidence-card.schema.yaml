# 证据卡 schema（v1.0）
version: "1.0"
required: [id, query, source, quote, score, grade, freshness_days, stance]
fields:
  id: {type: string, format: "E-YYYYMMDD-序号"}
  query: {type: string, note: 原始检索词/问题}
  source:
    type: object
    required: [url, title]
    fields:
      url: {type: string, format: uri}
      title: {type: string}
      publisher: {type: string}
      published_at: {type: string, format: date, note: 可空}
  quote: {type: string, max_length: 200, note: 原文摘录，不是转述}
  score: {type: number, min: 1.0, note: rerank 采纳线}
  grade: {type: string, enum: [A, B, C], note: "A=一手/可复算；B=权威媒体/研究；C=社区/二手"}
  data_quality_grade: {type: string, enum: [A, B, C], note: "方法论的 A/B/C 数据质量分级（与来源分级分开）"}
  freshness_days: {type: integer, min: 0, note: 该证据的有效期}
  retrieved_at: {type: string, format: date}
  stance: {type: string, enum: [supports, refutes, context]}
  used_for: {type: array, items: {type: string}, note: 关联分析/决策 ID}
  notes: {type: string}
