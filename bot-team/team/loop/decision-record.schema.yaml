# 决策记录 schema（v1.0）
version: "1.0"
required: [id, question, analysis_id, evidence_ids, options, chosen, confidence, reversibility, approval, reversal_conditions, expected_outcome, review_due, status]
fields:
  id: {type: string, format: "D-YYYYMMDD-序号"}
  question: {type: string}
  analysis_id: {type: string, format: "A-YYYYMMDD-序号"}
  evidence_ids: {type: array, items: {type: string}, min_items: 1}
  options: {type: array, items: {type: string}, min_items: 2}
  chosen: {type: string, note: option id 或 "不做"}
  rejected: {type: array, items: {type: object, fields: {option: {type: string}, reason: {type: string}}}}
  confidence: {type: string, enum: [HIGH, MED, LOW, UNKNOWN]}
  reversibility: {type: string, enum: [reversible, irreversible, partially]}
  approval:
    type: object
    required: [by, at, mode]
    fields:
      by: {type: string, note: 用户/负责人}
      at: {type: string, format: datetime}
      mode: {type: string, enum: [explicit, delegated, default], note: 单向门必须 explicit}
  reversal_conditions: {type: array, items: {type: string}, min_items: 1, note: 出现什么信号就重开}
  expected_outcome: {type: string, note: 可验证的预期结果}
  review_due: {type: string, format: date}
  # ---- 与《AI智能经营模型 v1.3》§4 决策日志字段对齐 ----
  entity_id: {type: string, note: 模具#/产线/班组}
  metric: {type: string, note: 补料率/停机时长/人均产量}
  context: {type: object, note: 当前指标值/实体状态/近 N 天趋势}
  recommendation: {type: string, note: 给业务负责人的建议}
  actual_action: {type: string, note: 实际执行（可与 recommendation 不同）}
  override_reason: {type: string}
  attribution_method: {type: string, enum: [exclusion, counterfactual, rule_based]}
  outcome_window: {type: string, note: 如 7d/30d}
  action_cost: {type: object, fields: {cny: {type: number}, items: {type: array, items: {type: string}}}}
  increment_value: {type: string, note: 增量价值口径}
  calibration_version: {type: string, note: 评分卡版本/冷启动标记}
  status: {type: string, enum: [proposed, approved, rejected, delivered, closed, superseded]}
  supersedes: {type: string, note: 错账新行勘误}
  cost_cny: {type: number}
  notes: {type: string}
