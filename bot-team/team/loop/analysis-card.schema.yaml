# 分析卡 schema（v1.0）
version: "1.0"
required: [id, question, options, criteria, weighted_scores, assumptions, disconfirming, premortem]
fields:
  id: {type: string, format: "A-YYYYMMDD-序号"}
  question: {type: string, note: 一句可取证的问题}
  options:
    type: array
    min_items: 2
    items:
      type: object
      required: [id, one_liner, cost, risk, reversibility]
      fields:
        id: {type: string}
        one_liner: {type: string}
        cost: {type: string}
        risk: {type: string}
        reversibility: {type: string, enum: [reversible, irreversible, partially]}
        evidence_ids: {type: array, items: {type: string}}
  criteria:
    type: array
    min_items: 2
    items:
      type: object
      required: [name, weight, score]
      fields:
        name: {type: string}
        weight: {type: number, min: 0, max: 1}
        score: {type: number, min: 1, max: 5}
        evidence_ids: {type: array, items: {type: string}}
  weighted_scores: {type: object, note: "option_id -> 加权分"}
  sensitivity: {type: string, note: 改权重最大的 1–2 个判据后结论是否翻转}
  judgement: {type: object, fields: {kind: {enum: [red_sea, blank, unknown]}, confidence: {enum: [HIGH, MED, LOW, UNKNOWN]}}}
  assumptions: {type: array, items: {type: string}, min_items: 1}
  disconfirming: {type: array, items: {type: string}, min_items: 1, note: 反面证据/反对意见}
  premortem: {type: array, items: {type: string}, min_items: 3, note: 6 个月后失败的最可能原因}
  recommendation: {type: string}
  # ---- 与《AI智能经营模型 v1.3》§3/§4 对齐 ----
  attribution_method: {type: string, enum: [exclusion, counterfactual, rule_based], note: 因素排除法为主，反事实为辅}
  degradation_level: {type: string, enum: [normal, counterfactual, manual], note: 空值率 10%/30% 分级}
  decision_contract: {type: string, note: 引用 assets/decision_contract_refill.yaml}
  scorecard:
    type: object
    note: 六维评分（数据完整性/时效性/显著性/排他性/历史/人机一致性）与 100 分制
  decision_id: {type: string, note: 拍板后回填}
