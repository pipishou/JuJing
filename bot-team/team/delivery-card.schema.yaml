# 交付卡 schema（v0.2）：老板能签字的那一页。
# 原则：首屏四块 + 签字栏 + 回看；证据链在附件，不塞首屏。

version: "0.2.0"

paper:
  title: 经营异常归因报告
  fields:
    report_id: {type: string, format: "DL-YYYYMMDD-序号"}
    date: {type: string, format: "YYYY-MM-DD"}
    company: {type: string, note: 客户/工厂名（脱敏）}
    line: {type: string, example: B 产线}
    anomaly: {type: string, example: 补料率 7 日 5.1%→7.2%}

first_screen:
  - key: finding
    label: 主因
    rule: ≤2 条；每条带 confidence 与 evidence 摘要
  - key: cannot_attribute
    label: 不确定性
    rule: 强制非空；至少 1 条
  - key: recommendation
    label: 建议与账
    rule: action + roi{cost,avoided,anchor} + irreversibility
  - key: next_step
    label: 下一步
    rule: 可验证、有时限（如 T+7 复查 7 日均值 ≤5.40%）

signature:
  roles:
    - {key: author, label: 报告人, example: 工作助理}
    - {key: reviewer, label: 复核人, example: 合规质检}
    - {key: boss, label: 老板签字, note: 签字即视为确认执行建议；不可逆动作另走 securityGate}
  statuses: [draft, pending_signature, signed, rejected]
  evidence: 每条 finding 可追溯到数据文件/上游 output；decision_log_entry 随卡归档

followup:
  days: 7
  steps: [host, compliance-reviewer]
  text: 复查主指标是否按预期回落；回填 actual_result 与复盘结论
