# 员工记忆 schema（v1.0）
version: "1.0"
required: [memory_id, employee_id, kind, text, source_ref, privacy, created_at]
fields:
  memory_id: {type: string, format: "M-YYYYMMDD-序号"}
  employee_id: {type: string, note: host/analyst/attr/biz/qa/data}
  entity: {type: string, note: 客户/工厂/产线/模具；为空表示通用}
  kind: {type: string, enum: [profile, preference, data_caveat, decision, outcome]}
  text: {type: string, max_length: 300, note: 一句话，不用来存原始数据}
  source_ref: {type: string, note: decision_id/report_id/data_file/URL}
  confidence: {type: string, enum: [HIGH, MED, LOW]}
  privacy: {type: string, enum: [public, internal, customer_sensitive]}
  created_at: {type: string, format: date}
  expires_at: {type: string, format: date}
  last_used_at: {type: string, format: date}
  supersedes: {type: string, note: 过期/更正用新行}
