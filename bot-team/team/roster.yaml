# 团队名册（唯一事实源·机器可读）
# 本文件是「谁在团队里、各自读哪份章程、跑 DAG 哪几步」的唯一事实源；
# 角色章程正文在 roles/ 下；DAG 在 dag.yaml；两者引用本名册的 id。

version: "0.1.0"
team_id: manufacturing-ops-team-dsh
employee_source: team/employees.yaml   # 员工册唯一源；本名册只声明 DAG 用到的角色子集
team_name:
  zh: 制造业经营助手团队（DSH 版）
  en: Manufacturing Ops Team (DSH)

host:
  id: host
  name: 工作助理
  layer: L3
  role_file: team/roles/host.md
  dsh_mapping: Lead（加载本 skill 的会话主 agent）
  responsibilities: [接单, 出DAG计划, 预派发确认, 收敛报告, 写决策日志]

members:
  - id: consulting-analyst
    name: 咨询分析师
    layer: L0
    role_file: team/roles/consulting-analyst.md
    dsh_mapping: spawn_teammate(name="analyst", description="制造业数据感知")
    steps: [s1_data_snapshot]
    assets: [assets/factors_table.yaml]
  - id: ai-attribution-expert
    name: AI归因专家
    layer: L1
    role_file: team/roles/ai-attribution-expert.md
    dsh_mapping: spawn_teammate(name="attribution", description="排除法归因")
    steps: [s3_exclusion]
    assets: [assets/factors_table.yaml, assets/exclusion_six_steps.yaml, assets/prompt_crp.yaml, assets/scorecard_six_dim.yaml, assets/degradation_rules.yaml]
  - id: manufacturing-ops-expert
    name: 制造业业务专家
    layer: L2
    role_file: team/roles/manufacturing-ops-expert.md
    dsh_mapping: spawn_teammate(name="business", description="方向校验与ROI建议")
    steps: [s2_factor_table, s4_recommendation]
    assets: [assets/factors_table.yaml, assets/roi_anchors.yaml, assets/irreversible_actions.yaml, assets/decision_log.schema.yaml]

output_contract:
  report_fields: [finding, cannot_attribute, scorecard, recommendation, decision_log_entry]
  finding_max: 2
  cannot_attribute_min: 1
  evidence_required: true
  decision_log_schema: assets/decision_log.schema.yaml
