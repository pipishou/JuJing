# A-7 ROI 锚点 — 制造业成本账三锚点
# 用于快速评估行动建议的性价比。可根据实际情况调整数值。
# [KNOWN] 来源：塑胶热测业务典型案例。

version: "0.1.0"
anchor_count: 3

anchors:
  - id: mold_repair
    label: 模具更换/修理
    base_cost_yuan: 800
    range_yuan: [300, 3000]
    typical_lead_time_hours: 4
    frequency: "低（数月一次）"
    impact: "直接影响零件精度和补料率"

  - id: maintenance
    label: 设备保养
    base_cost_yuan: 500
    range_yuan: [200, 1500]
    typical_lead_time_hours: 2
    frequency: "中（每周~每两周）"
    impact: "预防性维护，降低突发停机概率"

  - id: downtime
    label: 停机损失
    base_cost_yuan: 1200
    range_yuan: [400, 5000]
    per_hour_cost_yuan: 300
    frequency: "偶发（每月 0-2 次）"
    impact: "直接吞噬产能，含人工闲置 + 订单延误"

roi_formula: |
  ROI = (avoided_downtime_hours × 300 - action_cost) / action_cost
  当 ROI > 1.0 → 建议执行
  当 0 < ROI ≤ 1.0 → 评估后决定
  当 ROI < 0 → 不建议（除非不可逆动作的长期价值）

context_note: |
  以上为塑胶热测业务典型值。其他离散制造业（注塑/冲压/CNC 加工）
  数值在同一量级（±50%）。化工/连续制造业不适用，需单独校准。
