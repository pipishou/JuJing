# A-8 不可逆动作白名单 — 需要二次确认的行动
# [KNOWN] 来源：制造业现场安全纪律 + 产品引擎 P0 G0-9 安全基线。

version: "0.1.0"

definition: "执行后无法在短时间内撤销、撤销成本 ≥ 1000 元、或可能影响人身安全的动作"

triggers_second_confirmation:
  - "停线 / 停机（任何时间长度）"
  - "修改生产参数（温度/压力/射速/模具温度）"
  - "切换物料批次或供应商"
  - "发出外部采购/维修订单（金额 ≥ 1000 元）"
  - "要求人员加班 / 改班次"
  - "修改 SOP / 工艺文件"
  - "对外发布归因结论（涉及供应商责任）"
  - "清理生产数据 / 修改日志"

no_confirmation_needed:
  - "观察 / 检查 / 记录"
  - "与工程师讨论归因假设"
  - "生成报告（只读）"
  - "建议性提醒（如「请注意模具磨损率」）"

security_gate_mechanism:
  description: |
    当 AI 建议命中白名单动作时，输出结构必须包含：
    1. 动作名 + cost_yuan + roi 计算
    2. "⚠️ 此为不可逆动作，需要人类确认"
    3. 确认方式：HITL 中断（在 Octop 中触发 hitl_required）
  bypass_for: "仅 G0-8 探针测试模式可绕过"

output_example: |
  ⚠️ 建议行动：停机检修模具
    成本：¥1200（A-7 停机锚点）
    ROI：+0.33（避免 6h 停机损失）
  ⚠️ 此为不可逆动作，需要人类确认
  [HITL] 请厂长或主管确认后执行
