# A-5 降级规则 — 三触发器
# [KNOWN] 来源：塑胶热测业务 R9 口径 + 产品引擎 P0 设计决策。

version: "0.1.0"

triggers:

  - id: t1_data_quality
    domain: 数据质量
    thresholds:
      - "空值率 > 10% → 降级人工，不出 AI 建议"
      - "关键字段整列缺失 / 空值率 > 30% → 暂停并说明"
      - "数据采集时间戳跳跃 > 1h → 标记时间不连续"
      - "同一时刻 T 与 T-30 缺失任一 → 无法对比"
    action: "不产出归因结论，输出：「数据质量不足（X 原因），建议人工核查」"

  - id: t2_reasoning
    domain: 推理
    thresholds:
      - "候选因素 ≥ 2 且评分差值 < 20 分 → 反事实推断"
      - "所有候选评分 < 50 → 标记 LOW_CONFIDENCE"
      - "候选因素方向与异常方向相反 → 双重异常，需分别归因"
    action: "反事实推断模式：列出各假设 + 验证方法，不选单一归因"

  - id: t3_reliability
    domain: 可靠性（系统行为历史）
    thresholds:
      - "连续 3 次建议方向被证明错误 → 暂停 AI 建议"
      - "同场景归因每次不同 → 方法论不稳定"
      - "历史正确率 < 60%（滚动 10 次）→ 触发 R9 口径检查"
    action: "暂停 AI 建议，输出：「归因系统需迭代（历史正确率不足），建议人工处理」"

degradation_levels:
  level_0: "正常输出（全触发条件不命中）"
  level_1: "降级声明（局部数据/推理问题，输出带 cannot_attribute）"
  level_2: "反事实推断（多候选无法区分）"
  level_3: "完全不输出 AI 建议（数据质量严重 / 可靠性暂停）"
