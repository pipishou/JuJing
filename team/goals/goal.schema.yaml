# 目标 schema（v1.0）
version: "1.0"
required: [goal_id, entity, metric, baseline, target, deadline, cadence, owner, status]
fields:
  goal_id: {type: string, format: "G-YYYYMMDD-序号"}
  entity: {type: string, note: 客户/工厂/产线}
  metric: {type: string, example: 补料率}
  baseline: {type: number, note: 起算值}
  target: {type: number, note: 目标值}
  deadline: {type: string, format: date}
  cadence: {type: string, enum: [daily, weekly, monthly]}
  owner: {type: string, note: 业务负责人，不是 AI}
  status: {type: string, enum: [active, at_risk, achieved, abandoned]}
  linked_decisions: {type: array, items: {type: string}}
  progress:
    type: array
    items:
      type: object
      fields: {date: {type: string, format: date}, value: {type: number}, source: {type: string}, note: {type: string}}
  created_at: {type: string, format: date}
  review_due: {type: string, format: date}
