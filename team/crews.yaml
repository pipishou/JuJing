# 班组模板（v0.2）：编排是稀缺品，不堆量。
# 纪律：5~12 套上限｜一个人能干的活不进班组｜每套≥2 接力｜两头加、中间不塞纯审核｜
#       量按真人一次坐下来办得完｜交付只存任务文件夹、不代发｜交付后 followup 回看。

version: "0.2.0"
limits:
  min_crews: 5
  max_crews: 12
  min_steps: 2
  followup_days_min: 1
  followup_days_max: 30

crews:
  - id: c-refill-attribution
    name: 补料率归因
    purpose: 给小型制造业的补料率异常做根因归因与 ROI 算账
    want: 一条产线异常（指标＋时间窗＋变化幅度）
    needs: T 窗口与 T-30 基线数据、11 因素字段
    steps:
      - agent: consulting-analyst
        what: 读取 T/T-30，11 因素快照与空值率，输出 snapshot
      - agent: manufacturing-ops-expert
        what: 装载因素表，标注可得性与先验权重，输出 factor_table
      - agent: ai-attribution-expert
        what: 排除法六步，finding≤2，cannot_attribute 强制非空
      - agent: manufacturing-ops-expert
        what: 方向校验＋ROI 三锚点算账，输出 advice
      - agent: host
        what: 收敛报告、决策日志、交付卡
    end:
      kind: file
      followup:
        days: 7
        steps: [host, compliance-reviewer]
        text: 复查 7 日均值是否回落；回填 actual_result 与复盘结论
  - id: c-downtime-attribution
    name: 异常停机归因
    purpose: 同底座换数据源，处理停机时长异常
    want: 产线异常停机描述（时间窗/环比）
    needs: 停机记录、保养记录、换模记录
    steps:
      - agent: data-fetcher
        what: 只读取停机与保养数据，输出数据合同
      - agent: ai-attribution-expert
        what: 排除法归因，标注残差
      - agent: manufacturing-ops-expert
        what: 方向校验＋停机损失算账
      - agent: host
        what: 报告与交付卡
    end:
      kind: file
      followup:
        days: 7
        steps: [host]
        text: 复查停机时长是否下降；回填复盘
  - id: c-weekly-ops
    name: 周报与任务管理
    purpose: 内部经营周报与任务收口
    want: 本周任务清单与关键指标
    needs: 任务数据、上周周报
    steps:
      - agent: data-fetcher
        what: 只读拉取任务与指标数据
      - agent: manufacturing-ops-expert
        what: 汇总经营动作与风险
      - agent: host
        what: 生成周报与下周动作
    end:
      kind: file
      followup:
        days: 7
        steps: [host]
        text: 回看上周动作完成率
  - id: c-compliance-review
    name: 合规审查
    purpose: 横切复核班组交付物（夸大/假紧迫/价钱口径/功效边界）
    want: 待发布的交付卡或文案
    needs: 合规底稿、待审内容
    steps:
      - agent: compliance-reviewer
        what: 按合规底稿逐项检查，输出问题清单
      - agent: host
        what: 过/打回（打回必须改变交付物）
    end:
      kind: file
      followup:
        days: 7
        steps: [compliance-reviewer]
        text: 回看打回项是否复发
  - id: c-content-publish
    name: 内容选题与产出
    purpose: 把一条真实经营事实做成可分发内容（视频号/公众号），产出可直接拍的方案
    want: 一条真实事实（异常/改善/交付）＋可用素材说明
    needs: 数据快照或决策卡结论、可拍素材（车间/单据）、不可外发清单
    steps:
      - agent: consulting-analyst
        what: 取数对账，给出可引用的数字与时间窗，标出涉密项
      - agent: manufacturing-ops-expert
        what: 校验事实方向与算账口径，指出不能外发的商业信息
      - agent: content-operator
        what: 选题判断＋四段结构＋标题候选＋48h 复盘阈值
      - agent: compliance-reviewer
        what: 合规复核（夸大词/客户信息/功效边界）
      - agent: host
        what: 收敛成可拍内容方案与发布单
    end:
      kind: file
      followup:
        days: 7
        steps: [host, content-operator]
        text: 复查前 3 秒留存与转发；不达标先改标题与首帧
