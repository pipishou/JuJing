# 员工货架（v0.2）：状态语义精确到"为什么不能招"。
# 来源：行家来了 shelf.yml 六态语义（结构借鉴，领域内容全部重写）。

version: "0.2.0"

states:
  coming:
    label: 待上架
    meaning: 能力包（SKILL.md）还没写
    action: 不上架——空壳员工是欺诈
  not_ready:
    label: 准备中
    meaning: 包写完了，但依赖的外部服务没就绪
    action: 不上架——死按钮比没按钮伤害大
  craft:
    label: 工序
    meaning: 只在班组当一道工序，不独立上架
    action: 不出现在招聘页卡片
  resident:
    label: 常驻
    meaning: 常驻职能，不占招聘心智
    action: 不参与招聘计数
  retired:
    label: 已退役
    meaning: 停招，但留下历史产出（原料可复用）
    action: 退役≠删除
  active:
    label: 在岗
    meaning: 可独立接单的正常员工
    action: 出现在货架与班组

badges:
  flagship: 旗舰
  quality: 质检
  shared: 共享底稿

categories:
  - key: deliver
    name: 交付岗
    note: 直接产出经营归因与建议
  - key: quality
    name: 质量岗
    note: 合规、日志、回看
  - key: resident
    name: 常驻职能
    note: 不占招聘名额的固定职能

shelf_rules:
  - 货架按"店里的事"分组，不按技术栈分组。
  - 每个员工必须有 sample.md/sample.png（行为锚定，非装饰）。
  - 状态变化必须同步到班组可用性（死员工班组即失效）。
