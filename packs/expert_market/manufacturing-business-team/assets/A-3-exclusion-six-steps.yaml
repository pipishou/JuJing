# A-3 排除法六步 — 制造业归因核心流程
# [KNOWN] 来源：塑胶热测业务实战 + 通用根因分析方法论抽象。

version: "0.1.0"
title: 排除法六步（Exclusion Six-Step）

steps:

  - id: s1_snapshot_compare
    name: 快照对比
    input: 异常时刻 T 与基线时刻 T-30 的各因素状态
    action: 对 A-1 枚举表中每个因素，取 T 点和 T-30 点的值
    output: 二维表 rows=[因素], cols=[T-30, T, Δ, σ_ratio]
    gate: "至少 80% 的因素在两点有数据 → 否则触发 A-5 降级"

  - id: s2_change_mark
    name: 变化标记
    input: s1 输出二维表
    action: 对每个因素标记三态：changed / unchanged / missing
    output: 三态标记列追加到二维表
    rule: "changed = |Δ| > 2σ 或超过业务阈值"

  - id: s3_exclude
    name: 排除检查
    input: s2 输出
    action: 排除所有 unchanged 和 missing 因素
    output: 候选列表（≥ 1 个因素）
    rule: "如果候选列表为空 → 触发 A-5 降级：无法归因（所有因素无显著变化）"

  - id: s4_direction_verify
    name: 方向验证
    input: s3 候选列表 + 异常方向（如「补料率上升」）
    action: 检查每个候选因素的变化方向是否与异常方向一致
    output: 方向匹配标记
    rule: "反向因素 → 排除或标记为反向抑制（双重异常）"

  - id: s5_scorecard
    name: 置信度计算
    input: s4 方向匹配候选列表
    action: 用 A-2 六维评分卡对每个候选打分
    output: [(因素, 总分, 各维度分), ...]
    rule: "按总分降序排列；hard_guards 触发则降级"

  - id: s6_residual
    name: 残差处理
    input: s5 排序后列表
    action: |
      - 最高分 ≥ 70 且与第二分差值 ≥ 20 → 单一归因
      - 最高分 ≥ 70 但差值 < 20 → 反事实推断（标记 cannot_attribute）
      - 最高分 < 50 → 降级人工
      - 空值率 > 10% → 降级人工
    output: 最终归因结论
    gate: "产出必须含 cannot_attribute 槽位（即使是 '无不确定性' 也要写）"
