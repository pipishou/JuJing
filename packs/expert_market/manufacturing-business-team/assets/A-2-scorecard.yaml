# A-2 六维评分卡 — 候选因素置信度打分
# 等权重 16.67 × 6 = 100。三硬性护栏（任一不及格即降级）。
# [KNOWN] 来源：塑胶热测业务在役归因 20+ 案例校准。

version: "0.1.0"
weights:
  dimension_count: 6
  per_dimension: 16.67
  total: 100

dimensions:
  - id: d1_completeness
    name: 数据完整性
    question: 该因素的关键信号是否在 T 和 T-30 两点都有记录？
    scoring:
      100: 所有关键信号两点齐全
      70: 关键信号齐全 + 次要信号缺失 ≤ 20%
      40: 关键信号齐全 + 次要信号缺失 20-50%
      0: 关键信号有缺失

  - id: d2_timeliness
    name: 时效性
    question: 数据采集时间是否覆盖异常发生窗口（T-2h ~ T+2h）？
    scoring:
      100: 窗口内每分钟有记录
      70: 窗口内每 10min 有记录
      40: 窗口内有但间隔 > 30min
      0: 窗口内无记录

  - id: d3_significance
    name: 显著性
    question: T 与 T-30 的差值是否超过该因素的自然波动 2σ？
    scoring:
      100: > 3σ（99.7% 置信）
      70: 2-3σ（95% 置信）
      40: 1.5-2σ（90% 置信）
      0: < 1.5σ

  - id: d4_exclusivity
    name: 排他性
    question: 其他候选因素是否也有显著变化？
    scoring:
      100: 仅本因素显著
      70: 1 个其他因素同时显著
      40: 2-3 个其他因素同时显著
      0: ≥ 4 个其他因素同时显著

  - id: d5_historical
    name: 历史一致性
    question: 该因素过去引起同类异常的频次？
    scoring:
      100: ≥ 5 次（历史重复模式）
      70: 2-4 次（可疑模式）
      40: 1 次（孤立）
      0: 0 次（无历史关联）

  - id: d6_human_factor
    name: 人机置信度
    question: 一线工程师看到这个归因会说「这就是问题」吗？
    scoring:
      100: 多名工程师独立提出
      70: 1 名工程师提出 + 数据支撑
      40: 数据支撑但工程师未提出
      0: 无数据支撑 + 工程师未提出

hard_guards:
  - "任一维度得 0 → 总分封顶 30，标记 LOW_CONFIDENCE"
  - "d3_significance < 40 → 标记方向不明确"
  - "d4_exclusivity < 40 → 候选非唯一，走反事实推断"
