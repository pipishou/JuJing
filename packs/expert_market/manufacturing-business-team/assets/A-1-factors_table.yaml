# A-1 因素枚举表 — 离散制造业可观测因素全集
# 排除法六步的搜索空间。不在此表内的因素 → [UNKNOWN_FACTOR] 标记。
# [KNOWN] 来源：塑胶热测业务在役归因案例 + 通用离散制造 P-FMEA 框架。

version: "0.1.0"
domain: discrete-manufacturing
updated: "2026-10-12"

factors:

  # --- 生产端 ---
  - id: f_mold
    name: 模具状态
    category: production
    data_source: mold_maintenance_log
    signals: [磨损率, 保养周期, 上次维修日期]
    prior_weight: 0.20

  - id: f_material
    name: 原料批次
    category: production
    data_source: batch_tracking
    signals: [供应商, 批次号, 来料检验结果, 含水率]
    prior_weight: 0.15

  - id: f_machine
    name: 设备参数
    category: production
    data_source: machine_scada
    signals: [温度曲线, 压力曲线, 射速, 保压时间, 模具温度]
    prior_weight: 0.15

  - id: f_operator
    name: 班组/操作
    category: production
    data_source: shift_log
    signals: [当班班组, 操作工, 换班交接备注, SOP 执行偏差]
    prior_weight: 0.10

  # --- 环境端 ---
  - id: f_env_temp
    name: 车间温湿度
    category: environment
    data_source: env_sensor
    signals: [温度, 湿度, 变化速率]
    prior_weight: 0.08

  - id: f_env_power
    name: 供电/气压
    category: environment
    data_source: facility_monitor
    signals: [电压波动, 气压波动, 跳闸记录]
    prior_weight: 0.05

  # --- 质量端 ---
  - id: f_quality_std
    name: 质量标准变更
    category: quality
    data_source: quality_doc_log
    signals: [规格更新日期, 检测方法变更]
    prior_weight: 0.05

  - id: f_measurement
    name: 检测仪器
    category: quality
    data_source: instrument_calibration
    signals: [校准日期, 测量偏差, 仪器编号]
    prior_weight: 0.04

  # --- 排产/计划端 ---
  - id: f_schedule
    name: 排产变化
    category: planning
    data_source: erp_schedule
    signals: [换产频率, 急单插入, 节拍变化]
    prior_weight: 0.06

  - id: f_maintenance
    name: 计划性维护
    category: planning
    data_source: maintenance_calendar
    signals: [计划停机日期, 实际停机日期, 维护内容]
    prior_weight: 0.08

  # --- 外部 ---
  - id: f_supplier
    name: 供应商变更
    category: external
    data_source: procurement_log
    signals: [切换日期, 切换原因, 新供应商资质]
    prior_weight: 0.04

closure_warning: |
  本表为封闭世界假设（CRP）。枚举表漏因素时 Agent 会知道但不说。
  遇到 [UNKNOWN_FACTOR] 时必须：1) 显式标注 2) 建议人工补充枚举表。
